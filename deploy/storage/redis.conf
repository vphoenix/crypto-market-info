port 0
unixsocket /run/cmi/redis.sock
unixsocketperm 600
dir /data
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
save ""
maxmemory 512mb
maxmemory-policy noeviction
# Queue churn can double a small AOF every minute. Keep normal durable appends,
# but amortize compaction across several minute deliveries (see runtime docs).
auto-aof-rewrite-percentage 400
auto-aof-rewrite-min-size 256mb
protected-mode yes
