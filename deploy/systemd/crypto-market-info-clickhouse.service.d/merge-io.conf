# Merge I/O limits. Parameter changes require a coordinated database restart.
# Server-wide limits also affect other databases on this shared instance.
# Merge/mutation read limits do not cap total host writes or fsync IOPS.
# Install only with the existing unit's ExecStart unchanged except these caps.
[Service]
ExecStart=
ExecStart=/home/ubuntu/.local/share/crypto-market-info-clickhouse-bin/clickhouse server --log-file=/home/ubuntu/.local/share/crypto-market-info-clickhouse-logs/server.log --errorlog-file=/home/ubuntu/.local/share/crypto-market-info-clickhouse-logs/error.log --pid-file=%t/crypto-market-info-clickhouse/clickhouse.pid -- --path=/home/ubuntu/.local/share/crypto-market-info-clickhouse-data/ --listen_host=127.0.0.1 --http_port=8123 --tcp_port=9000 --logger.level=warning --logger.console=false --logger.size=100M --logger.count=3 --max_merges_bandwidth_for_server=16777216 --max_mutations_bandwidth_for_server=8388608
